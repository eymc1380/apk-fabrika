<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Filtre & Karantina</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161e2e;
      --border: #243046;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #0284c7;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .header {
      background-color: #0d1527;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-status {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      background: #111827;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .content {
      padding: 16px;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .sms-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: relative;
    }

    .sms-item.inbox {
      border-left: 4px solid var(--success);
    }

    .sms-item.spam {
      border-left: 4px solid var(--danger);
    }

    .sms-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .sms-sender {
      font-weight: bold;
      font-size: 0.95rem;
      color: #fff;
    }

    .sms-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sms-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .sms-body {
      font-size: 0.88rem;
      color: #d1d5db;
      line-height: 1.4;
      word-break: break-word;
    }

    .sms-reason {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 10px;
      font-size: 0.9rem;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag .remove-btn {
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛡️ SMS Filtreleme</h1>
    <span class="badge-status">Aktif</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('inbox')">Gelenler</button>
    <button class="tab-btn" onclick="switchTab('rules')">Kurallar</button>
    <button class="tab-btn" onclick="switchTab('spam')">Spam / Karantina</button>
  </div>

  <div class="content">
    <!-- GELENLER SEKMESİ -->
    <div id="tab-inbox" class="tab-pane active">
      <div id="inbox-list"></div>
    </div>

    <!-- KURALLAR SEKMESİ -->
    <div id="tab-rules" class="tab-pane">
      <div class="card">
        <h3>Başlık Engelleme</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Gönderici adı bu kelimelerden biriyle eşleşirse karantinaya alınır.</p>
        <div class="input-group">
          <input type="text" id="input-title" placeholder="Örn: BAHIS, KUMAR">
          <button class="btn-primary" onclick="addRule('titles')">Ekle</button>
        </div>
        <div id="tags-titles" class="tag-container"></div>
      </div>

      <div class="card">
        <h3>B-Kodu Engelleme (BTK)</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Mesaj sonundaki yetkili operatör kodu eşleşirse engellenir.</p>
        <div class="input-group">
          <input type="text" id="input-bcode" placeholder="Örn: B214, B002">
          <button class="btn-primary" onclick="addRule('bcodes')">Ekle</button>
        </div>
        <div id="tags-bcodes" class="tag-container"></div>
      </div>
    </div>

    <!-- SPAM / KARANTİNA SEKMESİ -->
    <div id="tab-spam" class="tab-pane">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button class="btn-danger" onclick="clearSpam()">Tüm Karantinayı Temizle</button>
      </div>
      <div id="spam-list"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "SMS_FILTER_RULES";

    function getBridge() {
      return window.AndroidBridge || null;
    }

    function loadRules() {
      const bridge = getBridge();
      if (bridge && bridge.getMessages) {
        try {
          const rules = bridge.getMessages("rules");
          if (rules && rules !== "[]") return JSON.parse(rules);
        } catch(e) {}
      }
      const local = localStorage.getItem(STORAGE_KEY);
      return local ? JSON.parse(local) : { titles: ["BAHIS", "BET", "KASINO"], bcodes: ["B214", "B002"] };
    }

    function saveRules(rules) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rules));
      const bridge = getBridge();
      if (bridge && bridge.saveRules) {
        bridge.saveRules(JSON.stringify(rules));
      }
      renderRules();
    }

    function addRule(type) {
      const input = document.getElementById(type === 'titles' ? 'input-title' : 'input-bcode');
      const val = input.value.trim().toUpperCase();
      if (!val) return;

      const rules = loadRules();
      if (!rules[type].includes(val)) {
        rules[type].push(val);
        saveRules(rules);
      }
      input.value = "";
    }

    function removeRule(type, val) {
      const rules = loadRules();
      rules[type] = rules[type].filter(item => item !== val);
      saveRules(rules);
    }

    function renderRules() {
      const rules = loadRules();
      ['titles', 'bcodes'].forEach(type => {
        const container = document.getElementById(`tags-${type}`);
        container.innerHTML = rules[type].map(item => `
          <div class="tag">
            <span>${item}</span>
            <span class="remove-btn" onclick="removeRule('${type}', '${item}')">&times;</span>
          </div>
        `).join('');
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

      event.currentTarget.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');

      loadMessages();
    }

    function deleteMessageItem(type, id) {
      if (!confirm("Bu mesaj silinsin mi?")) return;

      const key = type === 'inbox' ? 'inbox_messages' : 'spam_messages';
      const bridge = getBridge();

      if (bridge && bridge.deleteMessage) {
        bridge.deleteMessage(key, id);
      } else {
        const localKey = type === 'inbox' ? 'INBOX_SMS' : 'SPAM_SMS';
        let list = JSON.parse(localStorage.getItem(localKey) || "[]");
        list = list.filter(m => m.id !== id);
        localStorage.setItem(localKey, JSON.stringify(list));
      }

      loadMessages();
    }

    function loadMessages() {
      const bridge = getBridge();
      let inboxList = [];
      let spamList = [];

      if (bridge && bridge.getMessages) {
        try {
          const rawInbox = bridge.getMessages("inbox_messages");
          const rawSpam = bridge.getMessages("spam_messages");
          if (rawInbox) inboxList = JSON.parse(rawInbox);
          if (rawSpam) spamList = JSON.parse(rawSpam);
        } catch(e) {}
      } else {
        inboxList = JSON.parse(localStorage.getItem("INBOX_SMS") || "[]");
        spamList = JSON.parse(localStorage.getItem("SPAM_SMS") || "[]");
      }

      const inboxContainer = document.getElementById('inbox-list');
      if (inboxList.length === 0) {
        inboxContainer.innerHTML = '<div class="empty-state">Henüz gelen güvenli bir mesaj yok.</div>';
      } else {
        inboxContainer.innerHTML = inboxList.slice().reverse().map(m => `
          <div class="sms-item inbox">
            <div class="sms-header">
              <span class="sms-sender">${m.sender}</span>
              <div class="sms-meta">
                <span class="sms-date">${m.date}</span>
                <button class="btn-delete" title="Sil" onclick="deleteMessageItem('inbox', ${m.id})">🗑️</button>
              </div>
            </div>
            <div class="sms-body">${m.body}</div>
          </div>
        `).join('');
      }

      const spamContainer = document.getElementById('spam-list');
      if (spamList.length === 0) {
        spamContainer.innerHTML = '<div class="empty-state">Karantinada engellenmiş mesaj bulunmuyor.</div>';
      } else {
        spamContainer.innerHTML = spamList.slice().reverse().map(m => `
          <div class="sms-item spam">
            <div class="sms-header">
              <span class="sms-sender">${m.sender}</span>
              <div class="sms-meta">
                <span class="sms-date">${m.date}</span>
                <button class="btn-delete" title="Sil" onclick="deleteMessageItem('spam', ${m.id})">🗑️</button>
              </div>
            </div>
            <div class="sms-body">${m.body}</div>
            <div class="sms-reason">🚨 ${m.reason}</div>
          </div>
        `).join('');
      }
    }

    function clearSpam() {
      if (confirm("Karantinadaki tüm mesajlar silinsin mi?")) {
        const bridge = getBridge();
        if (bridge && bridge.clearMessages) {
          bridge.clearMessages("spam_messages");
        }
        localStorage.setItem("SPAM_SMS", "[]");
        loadMessages();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderRules();
      setTimeout(loadMessages, 500);
    });
  </script>
</body>
</html>
