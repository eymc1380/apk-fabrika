<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablo Excel Pro</title>
  <!-- TIFF Çözücü (UTIF.js) ve Excel Üretici (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #fbbf24;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    
    /* Üst Bar */
    .topbar {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .topbar h1 span { color: var(--accent); }
    .icon-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .container { padding: 14px; max-width: 900px; margin: 0 auto; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Ayarlar Paneli */
    #settingsPanel { display: none; border-left: 4px solid var(--accent); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #475569; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff;
    }
    . fetch-btn {
      background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1;
      padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .active-model-badge {
      display: inline-block; font-size: 11px; background: #fef3c7; color: #92400e;
      padding: 4px 8px; border-radius: 6px; font-weight: 600; margin-bottom: 10px; border: 1px solid #fde68a;
    }

    /* Butonlar */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 14px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-camera { background: var(--blue); }
    .btn-file { background: var(--primary); }
    .btn-analyze { background: #d97706; width: 100%; margin-top: 12px; font-size: 15px; }
    .btn-excel { background: var(--green); width: 100%; margin-top: 12px; font-size: 15px; }
    .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 6px; }

    /* Önizleme Alanı */
    .preview-list {
      display: flex; gap: 10px; overflow-x: auto; padding: 8px 0; margin-top: 8px;
    }
    .preview-item {
      position: relative; flex: 0 0 110px; height: 140px;
      border: 2px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #000;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: contain; }
    .preview-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15,23,42,0.85); color: var(--accent);
      font-size: 11px; text-align: center; padding: 3px; font-weight: 600;
    }

    /* Durum Çubuğu */
    .status-box {
      display: none; align-items: center; gap: 10px;
      padding: 12px; border-radius: 8px; background: #eff6ff;
      border: 1px solid #bfdbfe; color: #1e40af; font-size: 13px; margin-bottom: 14px;
    }
    .spinner {
      width: 18px; height: 18px; border: 3px solid #93c5fd;
      border-top-color: #1d4ed8; border-radius: 50%;
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sekmeler ve Tablo */
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .tab-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1;
      background: #f8fafc; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: var(--accent); border-color: var(--primary); }

    .table-wrap { overflow-x: auto; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 420px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    th, td {
      border: 1px solid #cbd5e1; padding: 8px 10px; min-width: 90px;
      outline: none; vertical-align: middle;
    }
    th { background: #f1f5f9; font-weight: 700; color: #334155; position: sticky; top: 0; z-index: 2; }
    td:focus, th:focus { background: #fef9c3; box-shadow: inset 0 0 0 2px #eab308; }
    .del-col { width: 34px; min-width: 34px; text-align: center; background: #fff1f2; }
    .del-row-btn {
      background: var(--red); color: #fff; border: none; border-radius: 4px;
      width: 22px; height: 22px; font-size: 12px; cursor: pointer;
    }
    .table-tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>📊 Tablo <span>Excel Pro</span></h1>
    <button class="icon-btn" onclick="toggleSettings()">⚙️ API & Model</button>
  </div>

  <div class="container">
    <!-- API ve Gelişmiş Model Ayar Kartı -->
    <div class="card" id="settingsPanel">
      <div class="form-group">
        <label>
          <span>Gemini API Anahtarı (Cihazda Kayıtlı Kalır)</span>
        </label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>

      <div class="form-group">
        <label>
          <span>Yapay Zeka Modeli (Tüm Seri)</span>
          <button type="button" class="fetch-btn" onclick="fetchAvailableModels()">🔄 API'den Canlı Çek</button>
        </label>
        <select id="modelInput" onchange="toggleCustomModelInput()">
          <optgroup label="⭐ Favori & Kararlı Tablo Motorları">
            <option value="gemini-2.5-flash">gemini-2.5-flash (Favori - Hızlı & Keskin Tablo)</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro (Derin Analiz & Karmaşık Tablo)</option>
          </optgroup>
          <optgroup label="🚀 Yeni Nesil (3.x & Pro Serisi)">
            <option value="gemini-3.1-pro-preview">3.1 Pro (gemini-3.1-pro-preview - Gelişmiş Akıl Yürütme)</option>
            <option value="gemini-3-flash-preview">3.8 / 3.0 Flash (gemini-3-flash-preview - Kapsamlı Yardım)</option>
            <option value="gemini-2.5-flash-lite">3.5 / 2.5 Flash-Lite (gemini-2.5-flash-lite - En Hızlı)</option>
          </optgroup>
          <optgroup label="📦 Klasik Modeller">
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          </optgroup>
          <optgroup label="🔧 Manuel Giriş">
            <option value="custom">✍️ Özel Model Kodu Yaz (4 Argon vb. API Kodu)...</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group" id="customModelGroup" style="display:none;">
        <label>Özel API Model Kodu</label>
        <input type="text" id="customModelInput" placeholder="Örn: gemini-3.1-pro-exp-01">
      </div>

      <button class="btn btn-file btn-sm" onclick="saveSettings()">💾 Ayarları Kaydet</button>
    </div>

    <!-- Dosya / Kamera Seçim Kartı -->
    <div class="card">
      <div class="active-model-badge" id="activeModelBadge">⚡ Aktif Motor: gemini-2.5-flash</div>
      <div class="btn-grid">
        <button class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">
          📷 Kamera ile Çek
        </button>
        <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">
          📂 Dosya / TIFF Seç
        </button>
      </div>

      <!-- Gizli Inputlar -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFiles(this.files)">
      <input type="file" id="fileInput" accept=".tif,.tiff,image/tiff,image/*" multiple style="display:none" onchange="handleFiles(this.files)">

      <div id="previewArea" style="display:none; margin-top:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:700; color:#475569;" id="pageCountText">Yüklenen Sayfalar</span>
          <button class="btn btn-sm" style="background:#64748b;" onclick="clearImages()">Temizle</button>
        </div>
        <div class="preview-list" id="previewList"></div>
        <button class="btn btn-analyze" id="analyzeBtn" onclick="analyzeImages()">
          🔍 Tabloyu Analiz Et (Gemini Vision)
        </button>
      </div>
    </div>

    <!-- Durum Gösterimi -->
    <div class="status-box" id="statusBox">
      <div class="spinner" id="statusSpinner"></div>
      <div id="statusText">İşlem yapılıyor...</div>
    </div>

    <!-- Sonuç ve Düzenleme Kartı -->
    <div class="card" id="resultCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size:15px;">✏️ Tablo Önizleme & Düzenleme</h3>
        <span style="font-size:11px; color:#64748b;">Hücrelere dokunarak düzeltebilirsiniz</span>
      </div>

      <div class="tabs" id="sheetTabs"></div>

      <div class="table-wrap">
        <table id="dataTable"></table>
      </div>

      <div class="table-tools">
        <button class="btn btn-sm" style="background:#3b82f6;" onclick="addRow()">➕ Satır Ekle</button>
        <button class="btn btn-sm" style="background:#6366f1;" onclick="addColumn()">➕ Sütun Ekle</button>
      </div>

      <button class="btn btn-excel" onclick="exportToExcel()">
        📥 Excel (.xlsx) Olarak Kaydet / Paylaş
      </button>
    </div>
  </div>

  <script>
    let loadedPages = [];
    let parsedSheets = [];
    let activeSheetIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key') || '';
      const savedModel = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';
      const savedCustom = localStorage.getItem('gemini_custom_model') || '';

      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('customModelInput').value = savedCustom;

      const selectEl = document.getElementById('modelInput');
      const optionExists = Array.from(selectEl.options).some(opt => opt.value === savedModel);

      if (optionExists) {
        selectEl.value = savedModel;
      } else if (savedModel) {
        selectEl.value = 'custom';
        document.getElementById('customModelInput').value = savedModel;
      }

      toggleCustomModelInput();
      updateActiveModelBadge();

      if (!savedKey) {
        document.getElementById('settingsPanel').style.display = 'block';
      }
    });

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function toggleCustomModelInput() {
      const val = document.getElementById('modelInput').value;
      document.getElementById('customModelGroup').style.display = val === 'custom' ? 'block' : 'none';
    }

    function getSelectedModel() {
      const sel = document.getElementById('modelInput').value;
      if (sel === 'custom') {
        return document.getElementById('customModelInput').value.trim() || 'gemini-2.5-flash';
      }
      return sel;
    }

    function updateActiveModelBadge() {
      const m = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';
      document.getElementById('activeModelBadge').innerText = `⚡ Aktif Motor: ${m}`;
    }

    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = getSelectedModel();
      if (!key) {
        alert('Lütfen geçerli bir Gemini API anahtarı girin.');
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('gemini_custom_model', document.getElementById('customModelInput').value.trim());
      updateActiveModelBadge();
      document.getElementById('settingsPanel').style.display = 'none';
      alert(`Ayarlar kaydedildi!\nAktif Model: ${model}`);
    }

    // Hesabın Erişebildiği Tüm Modelleri Google API'den Canlı Çeker
    async function fetchAvailableModels() {
      const key = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('gemini_api_key');
      if (!key) {
        alert('Modelleri sorgulamak için önce üstteki kutuya API Anahtarınızı yazın.');
        return;
      }
      showStatus('Google sunucularından hesabınıza tanımlı modeller çekiliyor...', true);
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if (!res.ok) throw new Error('API anahtarı doğrulanamadı veya model listesi alınamadı.');
        const data = await res.json();
        const models = (data.models || []).filter(m =>
          m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent')
        );

        if (models.length === 0) throw new Error('Uygun model bulunamadı.');

        const selectEl = document.getElementById('modelInput');
        let oldDynamic = document.getElementById('dynamicModelsGroup');
        if (oldDynamic) oldDynamic.remove();

        const optGroup = document.createElement('optgroup');
        optGroup.id = 'dynamicModelsGroup';
        optGroup.label = `🟢 Hesabınızda Aktif Tüm Modeller (${models.length} Adet)`;

        models.forEach(m => {
          const code = m.name.replace('models/', '');
          const opt = document.createElement('option');
          opt.value = code;
          opt.innerText = `${m.displayName || code} (${code})`;
          optGroup.appendChild(opt);
        });

        selectEl.insertBefore(optGroup, selectEl.firstChild);
        hideStatus();
        alert(`Başarılı! API anahtarınızın desteklediği ${models.length} model listeye eklendi.`);
      } catch (err) {
        showStatus('❌ Model çekme hatası: ' + err.message, false);
      }
    }

    function showStatus(msg, isLoading = true) {
      const box = document.getElementById('statusBox');
      const spin = document.getElementById('statusSpinner');
      const txt = document.getElementById('statusText');
      box.style.display = 'flex';
      spin.style.display = isLoading ? 'block' : 'none';
      txt.innerText = msg;
    }

    function hideStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }

    function clearImages() {
      loadedPages = [];
      document.getElementById('previewList').innerHTML = '';
      document.getElementById('previewArea').style.display = 'none';
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileInput').value = '';
    }

    async function handleFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      showStatus('Dosyalar okunuyor ve görüntüye dönüştürülüyor...', true);

      try {
        for (let i = 0; i < fileList.length; i++) {
          const file = fileList[i];
          const ext = file.name.toLowerCase();
          if (ext.endsWith('.tif') || ext.endsWith('.tiff') || file.type === 'image/tiff') {
            await decodeTiffFile(file);
          } else {
            await decodeStandardImage(file);
          }
        }
        renderPreviews();
        hideStatus();
      } catch (err) {
        console.error(err);
        showStatus('Dosya okuma hatası: ' + err.message, false);
      }
    }

    async function decodeTiffFile(file) {
      const buffer = await file.arrayBuffer();
      const ifds = UTIF.decode(buffer);
      if (!ifds || ifds.length === 0) throw new Error('TIFF içeriği çözümlenemedi.');

      for (let i = 0; i < ifds.length; i++) {
        UTIF.decodeImage(buffer, ifds[i]);
        const rgba = UTIF.toRGBA8(ifds[i]);
        const width = ifds[i].width;
        const height = ifds[i].height;

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        imgData.data.set(rgba);
        ctx.putImageData(imgData, 0, 0);

        const finalDataUrl = resizeCanvasIfNeeded(canvas, 2200);
        loadedPages.push({
          name: `TIFF S.${loadedPages.length + 1}`,
          dataUrl: finalDataUrl,
          base64: finalDataUrl.split(',')[1],
          mimeType: 'image/jpeg'
        });
      }
    }

    function decodeStandardImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const finalDataUrl = resizeCanvasIfNeeded(canvas, 2200);
            loadedPages.push({
              name: `Sayfa ${loadedPages.length + 1}`,
              dataUrl: finalDataUrl,
              base64: finalDataUrl.split(',')[1],
              mimeType: 'image/jpeg'
            });
            resolve();
          };
          img.onerror = () => reject(new Error('Görüntü yüklenemedi.'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Dosya okunamadı.'));
        reader.readAsDataURL(file);
      });
    }

    function resizeCanvasIfNeeded(sourceCanvas, maxDim) {
      let w = sourceCanvas.width;
      let h = sourceCanvas.height;
      if (w <= maxDim && h <= maxDim) {
        return sourceCanvas.toDataURL('image/jpeg', 0.88);
      }
      if (w > h) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }
      const out = document.createElement('canvas');
      out.width = w;
      out.height = h;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(sourceCanvas, 0, 0, w, h);
      return out.toDataURL('image/jpeg', 0.88);
    }

    function renderPreviews() {
      const area = document.getElementById('previewArea');
      const list = document.getElementById('previewList');
      const countTxt = document.getElementById('pageCountText');

      if (loadedPages.length === 0) {
        area.style.display = 'none';
        return;
      }
      area.style.display = 'block';
      countTxt.innerText = `Hazır Sayfa Sayısı: ${loadedPages.length}`;
      list.innerHTML = loadedPages.map((p, idx) => `
        <div class="preview-item">
          <img src="${p.dataUrl}" alt="${p.name}">
          <div class="preview-badge">${idx + 1}. ${p.name}</div>
        </div>
      `).join('');
    }

    async function analyzeImages() {
      const apiKey = localStorage.getItem('gemini_api_key');
      const model = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';

      if (!apiKey) {
        document.getElementById('settingsPanel').style.display = 'block';
        alert('Lütfen önce Gemini API Anahtarınızı girip kaydedin.');
        return;
      }
      if (loadedPages.length === 0) return;

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      parsedSheets = [];

      const systemPrompt = `Sen uzman bir veri ve finansal tablo okuma motorusun.
Gönderilen görüntüdeki tabloyu veya listeyi hiçbir satır ve sütunu atlamadan eksiksiz oku.
Kurallar:
1. Sadece geçerli bir JSON objesi döndür.
2. Hücre birleştirmeleri varsa alt/yan hücrelere mantıklı şekilde dağıt.
3. Sayıları, tarihleri, tutarları ve metinleri gördüğün gibi koru.
4. JSON formatı kesinlikle şöyle olmalıdır:
{
  "headers": ["Sütun 1", "Sütun 2", "Sütun 3"],
  "rows": [
    ["Değer 1A", "Değer 1B", "Değer 1C"],
    ["Değer 2A", "Değer 2B", "Değer 2C"]
  ]
}`;

      try {
        for (let i = 0; i < loadedPages.length; i++) {
          const page = loadedPages[i];
          showStatus(`${i + 1} / ${loadedPages.length} (${page.name}) [${model}] ile okunuyor...`, true);

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: systemPrompt },
                  { inline_data: { mime_type: page.mimeType, data: page.base64 } }
                ]
              }],
              generationConfig: {
                temperature: 0.1,
                responseMimeType: "application/json"
              }
            })
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || `API Hatası (${response.status})`);
          }

          const result = await response.json();
          let rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
          rawText = rawText.replace(/```json|```/g, '').trim();
          const parsed = JSON.parse(rawText);

          const headers = Array.isArray(parsed.headers) && parsed.headers.length > 0
            ? parsed.headers.map(String)
            : ['Sütun 1'];
          const rows = Array.isArray(parsed.rows)
            ? parsed.rows.map(r => Array.isArray(r) ? r.map(c => c == null ? '' : String(c)) : [])
            : [];

          parsedSheets.push({
            sheetName: `Sayfa_${i + 1}`,
            headers: headers,
            rows: rows
          });
        }

        activeSheetIndex = 0;
        renderResultSection();
        showStatus(`✅ Tüm sayfalar [${model}] ile başarıyla tabloya dönüştürüldü!`, false);
      } catch (err) {
        console.error(err);
        showStatus('❌ Hata: ' + err.message, false);
      } finally {
        btn.disabled = false;
      }
    }

    function renderResultSection() {
      if (parsedSheets.length === 0) return;
      document.getElementById('resultCard').style.display = 'block';

      const tabsEl = document.getElementById('sheetTabs');
      tabsEl.innerHTML = parsedSheets.map((s, idx) => `
        <button class="tab-btn ${idx === activeSheetIndex ? 'active' : ''}" onclick="switchSheet(${idx})">
          📄 ${s.sheetName} (${s.rows.length} Satır)
        </button>
      `).join('');

      renderActiveTable();
    }

    function switchSheet(idx) {
      syncDomToState();
      activeSheetIndex = idx;
      renderResultSection();
    }

    function renderActiveTable() {
      const sheet = parsedSheets[activeSheetIndex];
      const table = document.getElementById('dataTable');
      const colCount = Math.max(
        sheet.headers.length,
        ...sheet.rows.map(r => r.length),
        1
      );

      while (sheet.headers.length < colCount) {
        sheet.headers.push(`Sütun ${sheet.headers.length + 1}`);
      }

      let html = '<thead><tr><th class="del-col">#</th>';
      sheet.headers.forEach((h, cIdx) => {
        html += `<th contenteditable="true" data-col="${cIdx}">${escapeHtml(h)}</th>`;
      });
      html += '</tr></thead><tbody>';

      sheet.rows.forEach((row, rIdx) => {
        html += `<tr><td class="del-col"><button class="del-row-btn" onclick="deleteRow(${rIdx})">×</button></td>`;
        for (let cIdx = 0; cIdx < colCount; cIdx++) {
          const val = row[cIdx] !== undefined ? row[cIdx] : '';
          html += `<td contenteditable="true" data-row="${rIdx}" data-col="${cIdx}">${escapeHtml(val)}</td>`;
        }
        html += '</tr>';
      });
      html += '</tbody>';
      table.innerHTML = html;
    }

    function syncDomToState() {
      const sheet = parsedSheets[activeSheetIndex];
      if (!sheet) return;
      const table = document.getElementById('dataTable');

      const ths = table.querySelectorAll('thead th[contenteditable="true"]');
      if (ths.length > 0) {
        sheet.headers = Array.from(ths).map(th => th.innerText.trim());
      }

      const trs = table.querySelectorAll('tbody tr');
      sheet.rows = Array.from(trs).map(tr => {
        const tds = tr.querySelectorAll('td[contenteditable="true"]');
        return Array.from(tds).map(td => td.innerText.trim());
      });
    }

    function deleteRow(rIdx) {
      syncDomToState();
      parsedSheets[activeSheetIndex].rows.splice(rIdx, 1);
      renderResultSection();
    }

    function addRow() {
      syncDomToState();
      const sheet = parsedSheets[activeSheetIndex];
      const emptyRow = new Array(sheet.headers.length).fill('');
      sheet.rows.push(emptyRow);
      renderActiveTable();
    }

    function addColumn() {
      syncDomToState();
      const sheet = parsedSheets[activeSheetIndex];
      sheet.headers.push(`Sütun ${sheet.headers.length + 1}`);
      sheet.rows.forEach(r => r.push(''));
      renderActiveTable();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function exportToExcel() {
      syncDomToState();
      if (parsedSheets.length === 0) return;

      try {
        showStatus('Excel (.xlsx) dosyası hazırlanıyor...', true);
        const wb = XLSX.utils.book_new();

        parsedSheets.forEach((sheet, idx) => {
          const aoa = [sheet.headers, ...sheet.rows];
          const ws = XLSX.utils.aoa_to_sheet(aoa);

          const colWidths = sheet.headers.map((h, cIdx) => {
            let maxLen = h ? h.length : 10;
            sheet.rows.forEach(r => {
              const cellLen = r[cIdx] ? String(r[cIdx]).length : 0;
              if (cellLen > maxLen) maxLen = cellLen;
            });
            return { wch: Math.min(Math.max(maxLen + 3, 10), 45) };
          });
          ws['!cols'] = colWidths;

          const safeName = (sheet.sheetName || `Sayfa_${idx + 1}`).substring(0, 31);
          XLSX.utils.book_append_sheet(wb, ws, safeName);
        });

        const now = new Date();
        const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
        const fileName = `Tablo_${stamp}.xlsx`;

        if (window.Capacitor && window.Capacitor.isNativePlatform()) {
          const wbBase64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
          const Filesystem = window.Capacitor.Plugins.Filesystem;
          const Share = window.Capacitor.Plugins.Share;

          const savedFile = await Filesystem.writeFile({
            path: fileName,
            data: wbBase64,
            directory: 'CACHE'
          });

          hideStatus();
          await Share.share({
            title: 'Excel Tablosu',
            text: fileName,
            url: savedFile.uri,
            dialogTitle: 'Excel Dosyasını Kaydet veya Paylaş'
          });
        } else {
          XLSX.writeFile(wb, fileName);
          showStatus(`✅ ${fileName} indirildi.`, false);
        }
      } catch (err) {
        console.error(err);
        showStatus('❌ Excel aktarım hatası: ' + err.message, false);
      }
    }
  </script>
</body>
</html>
