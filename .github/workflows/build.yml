name: Otomatik APK Derleyici (YMC Store)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Capacitor Projesini ve Native Katmanı Hazırla
        run: |
          npm install
          npx cap add android

          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo $APP_ID | tr '.' '/')
          echo "Aktif Paket Yolu: $PKG_PATH"

          [ -f native/AndroidManifest.xml ] && cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          if compgen -G "native/*.java" > /dev/null; then
            mkdir -p android/app/src/main/java/$PKG_PATH/
            cp native/*.java android/app/src/main/java/$PKG_PATH/
          fi

          # Capacitor varsayılan ikon ve splash dosyalarını temizle (drawable-v24 vb. çakışmaları önle)
          rm -rf android/app/src/main/res/drawable-v24/ic_launcher* \
                 android/app/src/main/res/drawable/ic_launcher* \
                 android/app/src/main/res/drawable/splash.png \
                 android/app/src/main/res/drawable-land-* \
                 android/app/src/main/res/drawable-port-* \
                 android/app/src/main/res/mipmap-*/ic_launcher* \
                 android/app/src/main/res/values/ic_launcher_background.xml

          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values-v31 android/app/src/main/res/drawable
          [ -f native/file_paths.xml ] && cp native/file_paths.xml android/app/src/main/res/xml/file_paths.xml || true
          [ -f native/colors.xml ] && cp native/colors.xml android/app/src/main/res/values/colors.xml || true
          [ -f native/styles.xml ] && cp native/styles.xml android/app/src/main/res/values/styles.xml || true
          [ -f native/styles-v31.xml ] && cp native/styles-v31.xml android/app/src/main/res/values-v31/styles.xml || true
          [ -f native/launch_screen.xml ] && cp native/launch_screen.xml android/app/src/main/res/drawable/launch_screen.xml || true

          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -d "native/$d" ]; then
              mkdir -p "android/app/src/main/res/$d"
              cp "native/$d/"*.png "android/app/src/main/res/$d/" || true
            fi
          done

          if [ -f native/ic_launcher_foreground.xml ]; then
            cp native/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
            [ -f native/ic_launcher_background.xml ] && cp native/ic_launcher_background.xml android/app/src/main/res/drawable/ic_launcher_background.xml || true
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # Google Sign-In SDK bağımlılığını Gradle'a ekle
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
          }
          EOF

          npx cap sync android

      - name: 5. Keystore Hazırla ve SHA-1 Parmak İzini Yazdır
        env:
          YMC_KEYSTORE_B64: ${{ secrets.YMC_KEYSTORE_B64 }}
          YMC_KEYSTORE_PASS: ${{ secrets.YMC_KEYSTORE_PASS }}
          YMC_KEY_ALIAS: ${{ secrets.YMC_KEY_ALIAS }}
          YMC_KEY_PASS: ${{ secrets.YMC_KEY_PASS }}
        run: |
          STORE_PASS="${YMC_KEYSTORE_PASS:-erhan123}"
          KEY_ALIAS="${YMC_KEY_ALIAS:-ymcstore}"
          KEY_PASS="${YMC_KEY_PASS:-erhan123}"

          if [ -n "$YMC_KEYSTORE_B64" ]; then
            echo "$YMC_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          else
            keytool -genkey -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Erhan Yamac, OU=Store, O=YMC, L=Bitlis, C=TR"
          fi

          echo "### İmzalama Sertifika Parmak İzleri (Google Sign-In İçin)" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep -E "SHA1:|SHA256:" | tee -a $GITHUB_STEP_SUMMARY

          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode = 100 + ${{ github.run_number }}
                  versionName = "1.0.${{ github.run_number }}"
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '$STORE_PASS'
                      keyAlias '$KEY_ALIAS'
                      keyPassword '$KEY_PASS'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 6. APK Dosyasını Derle ve İmzala (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. İmzalı APK'yı Dal (Branch) Adıyla Kaydet
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ${{ github.ref_name }}-signed.apk

      - name: 8. APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-signed
          path: ${{ github.ref_name }}-signed.apk
