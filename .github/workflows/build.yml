name: Otomatik APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Capacitor Projesini Hazırla
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

          # Native dosyaları kopyala
          cp -r native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r native/*.java android/app/src/main/java/com/erhan/apkfabrika/
          
          # Renk, stil ve splash dosyalarını yerleştir
          [ -f native/colors.xml ] && cp native/colors.xml android/app/src/main/res/values/colors.xml || true
          [ -f native/styles.xml ] && cp native/styles.xml android/app/src/main/res/values/styles.xml || true
          [ -f native/launch_screen.xml ] && cp native/launch_screen.xml android/app/src/main/res/drawable/launch_screen.xml || true
          [ -f native/ic_launcher_foreground.xml ] && cp native/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml || true

          # Masaüstü İkonunu Doğrudan Kalkan Vektörüne Zorla (Android 8+)
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/splash_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          npx cap copy android

      - name: 5. Sabit Keystore Oluştur ve Gradle'a Tanımla
        run: |
          # Sabit debug/release anahtarı oluştur
          keytool -genkey -v -keystore android/app/release.keystore -alias smsapp -keyalg RSA -keysize 2048 -validity 10000 -storepass erhan123 -keypass erhan123 -dname "CN=Erhan, OU=SMS, O=Fabrika, L=Bitlis, C=TR"

          # Gradle dosyasına otomatik artan versionCode ve sabit imzalama bloğunu ekle
          cat << 'EOF' >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode = 100 + ${{ github.run_number }}
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'erhan123'
                      keyAlias 'smsapp'
                      keyPassword 'erhan123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 6. APK Dosyasını Derle ve İmzala (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. İmzalı ve Hizalanmış APK'yı Kaydet
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sms-fabrika-signed.apk

      - name: 8. APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sms-fabrika-signed
          path: sms-fabrika-signed.apk
