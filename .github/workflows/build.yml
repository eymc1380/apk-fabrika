name: Otomatik APK Derleyici

on:
  push:
    branches: [ "*" ] # Hangi dalda (branch) kayıt yaparsan yap otomatik tetiklenir
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Capacitor Projesini Hazırla (Dinamik Paket ve Native Desteği)
        run: |
          # Eğer package.json yoksa oluştur, varsa içindeki paketleri (filesystem, share vb.) kur
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap add android

          # capacitor.config.json içinden appId'yi otomatik oku ve klasör yoluna çevir (Örn: com/erhan/tabloexcel)
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo $APP_ID | tr '.' '/')
          echo "Aktif Paket Yolu: $PKG_PATH"

          # Native dosyalar varsa (örneğin SMS projesinde) kopyala, yoksa hata vermeden geç
          [ -f native/AndroidManifest.xml ] && cp -r native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          if compgen -G "native/*.java" > /dev/null; then
            mkdir -p android/app/src/main/java/$PKG_PATH/
            cp -r native/*.java android/app/src/main/java/$PKG_PATH/
          fi
          
          # Renk, stil ve splash dosyaları varsa yerleştir
          [ -f native/colors.xml ] && cp native/colors.xml android/app/src/main/res/values/colors.xml || true
          [ -f native/styles.xml ] && cp native/styles.xml android/app/src/main/res/values/styles.xml || true
          [ -f native/launch_screen.xml ] && cp native/launch_screen.xml android/app/src/main/res/drawable/launch_screen.xml || true
          
          if [ -f native/ic_launcher_foreground.xml ]; then
            cp native/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/splash_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # Web varlıklarını ve Capacitor eklentilerini senkronize et
          npx cap sync android

      - name: 5. Sabit Keystore Oluştur ve Gradle'a Tanımla
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias fabrika -keyalg RSA -keysize 2048 -validity 10000 -storepass erhan123 -keypass erhan123 -dname "CN=Erhan, OU=IT, O=Fabrika, L=Bitlis, C=TR"

          cat << 'EOF' >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode = 100 + ${{ github.run_number }}
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'erhan123'
                      keyAlias 'fabrika'
                      keyPassword 'erhan123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 6. APK Dosyasını Derle ve İmzala (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. İmzalı APK'yı Dal (Branch) Adıyla Kaydet
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ${{ github.ref_name }}-signed.apk

      - name: 8. APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-signed
          path: ${{ github.ref_name }}-signed.apk
