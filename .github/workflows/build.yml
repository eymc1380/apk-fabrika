name: Otomatik APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Capacitor Projesini Hazırla
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

          # Sürüm kodunu GitHub run_number ile otomatik artır (üzerine güncelleme için)
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle

          # Native dosyaları yerine kopyala
          cp -r native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r native/*.java android/app/src/main/java/com/erhan/apkfabrika/
          
          # Renk ve ikon dosyaları varsa kopyala
          [ -f native/colors.xml ] && cp native/colors.xml android/app/src/main/res/values/colors.xml || true
          [ -f native/styles.xml ] && cp native/styles.xml android/app/src/main/res/values/styles.xml || true
          [ -f native/launch_screen.xml ] && cp native/launch_screen.xml android/app/src/main/res/drawable/launch_screen.xml || true
          [ -f native/ic_launcher_foreground.xml ] && cp native/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml || true

          npx cap copy android

      - name: 5. Sabit Keystore (İmza Anahtarı) Oluştur
        run: |
          # Sabit bir imza anahtarı oluştur (Her derlemede aynı imza kullanılacak)
          keytool -genkey -v -keystore release.keystore -alias smsapp -keyalg RSA -keysize 2048 -validity 10000 -storepass erhan123 -keypass erhan123 -dname "CN=Erhan, OU=SMS, O=Fabrika, L=Bitlis, C=TR"

      - name: 6. APK Dosyasını Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. APK'yı Sabit Anahtarla İmzala ve Hizala
        run: |
          # Üretilen Release APK'yı sabit anahtarla imzala
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass erhan123 -keypass erhan123 android/app/build/outputs/apk/release/app-release-unsigned.apk smsapp
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk sms-fabrika-signed.apk

      - name: 8. İmzalı APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sms-fabrika-signed
          path: sms-fabrika-signed.apk
