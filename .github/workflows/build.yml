name: Otomatik APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repo kodlarini cek
        uses: actions/checkout@v4

      - name: 2. Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Java JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Capacitor hazirla ve Android projesini olustur
        run: |
          npm install
          npx cap add android
          npx cap sync

      - name: 5. Ozel SMS dosyalarini Android projesine monte et
        run: |
          cp native/SmsReceiver.java android/app/src/main/java/com/erhan/apkfabrika/SmsReceiver.java
          cp native/MainActivity.java android/app/src/main/java/com/erhan/apkfabrika/
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 6. APK dosyasini derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Uretilen APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: APK-SMS-Engelleyici
          path: android/app/build/outputs/apk/debug/app-debug.apk
